<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuddyBoard</title>
<meta http-equiv="refresh" content="0; url=../">
</head>
<body style="font-family:system-ui;padding:24px">
<p>BuddyBoard has moved. <a href="../">Open BuddyBoard</a></p>
<script>
  // Remove the old v2 offline app from this device, then go to the new address.
  (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
    .then(regs => Promise.all(regs.filter(r => r.scope.endsWith('/v2/')).map(r => r.unregister())))
    .finally(() => location.replace('../'));
</script>
</body>
</html>
